# ===========================
# PostgreSQL Secret
# NOTE: In production, secrets should be managed via a sealed-secret controller,
# external secrets operator, or SOPS. NEVER commit plain-text secrets.
# These base64 values are for LOCAL DEVELOPMENT ONLY.
# ===========================
# echo -n 'postgres' | base64 => cG9zdGdyZXM=
# echo -n 'password13' | base64 => cGFzc3dvcmQxMw==
# echo -n 'MasterAnnonce' | base64 => TWFzdGVyQW5ub25jZQ==
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: masterannonce
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cGFzc3dvcmQxMw==
  POSTGRES_DB: TWFzdGVyQW5ub25jZQ==
