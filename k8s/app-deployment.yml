apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterannonce-app
  labels:
    app: masterannonce
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: masterannonce
      tier: backend
  template:
    metadata:
      labels:
        app: masterannonce
        tier: backend
    spec:
      containers:
        - name: masterannonce
          # Build with: eval $(minikube docker-env) && docker build -t masterannonce:latest .
          image: masterannonce:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: masterannonce-service
  labels:
    app: masterannonce
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: masterannonce
    tier: backend
